name: Agent Verify

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The repository does not currently commit an npm lockfile, so npm ci cannot run.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build-time placeholder only; the build checks configuration but does not connect to this database.
          DATABASE_URL: postgresql://feedlyst:feedlyst@127.0.0.1:5432/feedlyst
