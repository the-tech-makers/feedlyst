name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-placeholder-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feedlyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Commit generated lockfile to this same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No generated lockfile changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: add generated npm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - run: npm run db:generate
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
