name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-placeholder-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feedlyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Capture generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - run: npm run db:generate
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
